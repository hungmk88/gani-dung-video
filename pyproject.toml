[project]
name = "gani-dung-video"
version = "2.0.0.dev0"
description = "App Dựng Video GANI v2 — rule engine + AI trong khung (Đặc tả v2.1)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "faster-whisper>=1.2",
    # 4.10.0.84: pip-audit clean 28/09/2026; headless = no GUI deps (X11/Qt).
    "opencv-python-headless==4.10.0.84",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]
# Phase 3c (CLIP + LAION). pip-audit clean 28/09/2026 (OSV + PyPI, 22-package tree).
# torch 2.14 wheels: macOS 14+ Apple Silicon, Windows x64 (CPU), Linux.
ai = ["torch==2.14.0", "torchvision==0.29.0", "open-clip-torch==3.3.0"]

[project.scripts]
gani-dv = "gani_dung_video.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# × and – are used on purpose in spec references (6 × 4, X1–X18, 60–85 BPM).
allowed-confusables = ["×", "–"]

[tool.mypy]
strict = true
mypy_path = "src"
# 3.12: pytest's type hints pull in numpy stubs that use 3.12-only syntax. Runtime
# compatibility with 3.11 is still enforced by ruff (target-version = "py311").
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# faster-whisper and open_clip ship no type hints; torch/PIL come with the optional [ai] extra,
# so mypy must pass without them. All are confined to one infrastructure module each.
module = [
    "faster_whisper", "faster_whisper.*", "open_clip", "open_clip.*",
    "torch", "torch.*", "PIL", "PIL.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/gani_dung_video"]
