# CI: the same checks the project's "Done" asks for (README → Phát triển), on every PR and on main.
#
# Notes for whoever maintains this file:
# - Runner: pinned to ubuntu-24.04 (16/10/2026), not ubuntu-latest, which moves to Ubuntu 26 from
#   19/10/2026 (actions/runner-images#14748). Bump it on purpose, in its own PR.
# - ffmpeg: the render graph needs ffmpeg >= 7.0 (`-/filter_complex`, see ffmpeg_render.py), but
#   Ubuntu 24.04 ships 6.1, so the real-render tests would stop at the version check. The job
#   installs a static BtbN build instead, pinned by release tag, file name AND sha256 written
#   here: a moved or replaced file fails the job instead of being installed. The tag is the last
#   build of a month on purpose: BtbN prunes daily builds after 14 but keeps each month's last
#   build for 24 months (util/prunetags.sh in BtbN/FFmpeg-Builds). The "latest" release must
#   not be used: it is replaced every day and its file names change with each point release.
#   To bump: pick another month-end autobuild tag, copy the linux64-gpl line of its
#   checksums.sha256 into FFMPEG_TAG / FFMPEG_ASSET / FFMPEG_SHA256 together.
# - No secrets are used and none are needed: the tests run without ANTHROPIC_API_KEY.
# - Runs on Linux, so it also covers the POSIX branch of process_runner that the Windows dev
#   machine cannot exercise.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_TAG: autobuild-2026-09-30-13-08
  FFMPEG_ASSET: ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz
  FFMPEG_SHA256: 68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg (static build, >= 7)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$FFMPEG_ASSET" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$FFMPEG_ASSET"
          echo "$FFMPEG_SHA256  $FFMPEG_ASSET" | sha256sum -c -
          mkdir -p "$HOME/ffmpeg"
          tar -xJf "$FFMPEG_ASSET" -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python --version

      - name: Install the package with the dev tools
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict src tests

      - name: pytest
        run: pytest

  frontend:
    name: Frontend (test, tsc, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: node --test (pure .ts tests)
        run: npm test

      - name: tsc
        run: npx tsc -b

      - name: oxlint
        run: npm run lint

      - name: build (real mode)
        run: npm run build:real

      # Warning only (decision 14/10/2026): a High/Critical advisory is shown in the log and in
      # the run summary, but never fails the build.
      - name: npm audit (warning only)
        continue-on-error: true
        run: |
          if npm audit --audit-level=high; then
            echo "npm audit: no High/Critical advisories."
          else
            echo "::warning title=npm audit::High or Critical advisories found; see this step's log (npm audit fix may resolve them)."
          fi
